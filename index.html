<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe | Digital Catalog</title>
    <!-- Elegant Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-icon"><i class="fas fa-bars"></i></div>
            <div class="logo">LUXE.</div>
            <div class="nav-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-shopping-bag"></i>
            </div>
        </div>
    </nav>

    <!-- Main Storefront -->
    <main class="store-container">
        <!-- Dynamic Category Filters -->
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" onclick="filterProducts('All')">All</button>
            <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
            <button class="filter-btn" onclick="filterProducts('Tops')">Tops</button>
            <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
            <button class="filter-btn" onclick="filterProducts('Accessories')">Accessories</button>
        </div>

        <!-- Compact Product Grid -->
        <div class="product-grid" id="product-grid">
            <!-- Products injected here -->
        </div>
    </main>

    <!-- FULL SCREEN PRODUCT PAGE (Hidden by default) -->
    <div id="product-page" class="product-page-overlay">
        <!-- Sticky Header for Product Page -->
        <div class="product-page-header">
            <button class="back-btn" onclick="closeProductPage()"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="logo" style="font-size: 1.2rem;">LUXE.</div>
            <i class="fas fa-shopping-bag"></i>
        </div>

        <div class="product-page-content">
            <!-- 3-Angle Gallery -->
            <div class="product-gallery">
                <div class="main-image-container" id="detail-main-img">
                    <!-- Main Emoji -->
                </div>
                <div class="thumbnail-container" id="detail-thumbnails">
                    <!-- Thumbnails injected here -->
                </div>
            </div>

            <!-- Product Info & Actions -->
            <div class="product-details">
                <p class="detail-category" id="detail-category">Category</p>
                <h1 class="detail-title" id="detail-title">Product Name</h1>
                <p class="detail-price" id="detail-price">$0.00</p>
                
                <button class="add-to-cart-btn"><i class="fas fa-shopping-cart"></i> Add to Cart</button>
                
                <div class="detail-description">
                    <h3>Description</h3>
                    <p>Premium quality material with excellent craftsmanship. Designed for comfort and modern aesthetic. Perfect for any occasion.</p>
                </div>
            </div>

            <!-- Related Products (Same Category) -->
            <div class="related-section">
                <h2>Similar in <span id="related-category-name">Category</span></h2>
                <div class="compact-scroll-grid" id="related-grid"></div>
            </div>

            <!-- Other Categories -->
            <div class="related-section">
                <h2>You Might Also Like</h2>
                <div class="compact-scroll-grid" id="others-grid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
