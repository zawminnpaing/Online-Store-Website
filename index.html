<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe | Digital Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="closeAllViews()">LUXE.</div>
            <div class="nav-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-user"></i>
                <div class="cart-icon-wrapper" onclick="openCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cart-count-badge">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- === CATALOG VIEW === -->
    <div id="catalog-view">
        <header class="hero">
            <div class="hero-content">
                <h1>The New Collection</h1>
                <p>Elevate your everyday style.</p>
            </div>
        </header>
        <main class="store-container">
            <div class="filter-bar" id="filter-bar">
                <button class="filter-btn active" onclick="filterProducts('All')">All</button>
                <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
                <button class="filter-btn" onclick="filterProducts('Tops')">Tops</button>
                <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
                <button class="filter-btn" onclick="filterProducts('Accessories')">Accessories</button>
            </div>
            <div class="product-grid" id="product-grid"></div>
        </main>
    </div>

    <!-- === PRODUCT DETAIL VIEW === -->
    <div id="product-view" style="display: none;">
        <main class="detail-container">
            <button class="back-btn" onclick="closeAllViews()">
                <i class="fas fa-arrow-left"></i> Back to Catalog
            </button>

            <div class="detail-layout">
                <div class="detail-gallery">
                    <div class="main-image-container">
                        <div class="emoji-placeholder large-emoji" id="detail-main-img">🧥</div>
                    </div>
                    <div class="thumbnail-row" id="detail-thumbnails"></div>
                </div>

                <div class="detail-info">
                    <p class="product-brand" id="detail-category">Category</p>
                    <h1 class="detail-title" id="detail-title">Product Name</h1>
                    <p class="detail-price" id="detail-price">$0.00</p>
                    
                    <div class="qty-selector">
                        <button onclick="changeQty(-1)">-</button>
                        <input type="number" id="item-qty" value="1" min="1" readonly>
                        <button onclick="changeQty(1)">+</button>
                    </div>
                    
                    <!-- Hidden input to store product ID for the cart -->
                    <input type="hidden" id="current-product-id">

                    <button class="add-to-cart-btn" onclick="addToCart()">
                        Add to Cart <i class="fas fa-shopping-bag"></i>
                    </button>
                    
                    <div class="shipping-info">
                        <p><i class="fas fa-truck"></i> Free shipping on orders over $150</p>
                        <p><i class="fas fa-undo"></i> 30-day return policy</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- === CART & CHECKOUT VIEW === -->
    <div id="cart-view" style="display: none;">
        <main class="detail-container">
            <button class="back-btn" onclick="closeAllViews()">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </button>

            <div class="cart-layout">
                <!-- Cart Items Section -->
                <div class="cart-items-section">
                    <h2>Your Bag</h2>
                    <div id="cart-items-container">
                        <!-- Cart items injected here -->
                    </div>
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cart-total-price">$0.00</span>
                    </div>
                </div>

                <!-- Checkout Form Section -->
                <div class="checkout-section">
                    <h2>Checkout Details</h2>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="cust-name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="tel" id="cust-phone" placeholder="09xxxxxxxxx" required>
                        </div>
                        <div class="form-group">
                            <label>Delivery Location (Full Address)</label>
                            <textarea id="cust-address" rows="3" placeholder="Apt, Street, Township, City" required></textarea>
                        </div>
                    </form>

                    <div class="checkout-actions">
                        <p class="action-title">Place Order Via:</p>
                        <button class="checkout-btn telegram-btn" onclick="processCheckout('telegram')">
                            <i class="fab fa-telegram-plane"></i> Send to Telegram
                        </button>
                        <button class="checkout-btn viber-btn" onclick="processCheckout('viber')">
                            <i class="fab fa-viber"></i> Send to Viber
                        </button>
                        
                        <div class="manual-call">
                            <p>Or order manually by calling:</p>
                            <a href="tel:+959793155856" class="call-btn"><i class="fas fa-phone-alt"></i> 09793155856</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Professional Footer -->
    <footer class="store-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Luxe Fashion. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
