<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe | Digital Catalog</title>
    <!-- Elegant Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">LUXE.</div>
            <div class="nav-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-user"></i>
                <i class="fas fa-shopping-bag"></i>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>The New Collection</h1>
            <p>Elevate your everyday style with our latest arrivals.</p>
        </div>
    </header>

    <!-- Main Storefront -->
    <main class="store-container">
        
        <!-- Dynamic Category Filters -->
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" onclick="filterProducts('All')">All</button>
            <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
            <button class="filter-btn" onclick="filterProducts('Tops')">Tops</button>
            <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
            <button class="filter-btn" onclick="filterProducts('Accessories')">Accessories</button>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="product-grid">
            <!-- Products will be injected here by JavaScript -->
        </div>

    </main>

    <!-- Professional Footer -->
    <footer class="store-footer">
        <div class="footer-grid">
            <div class="footer-brand">
                <h2>LUXE.</h2>
                <p>Curated fashion for the modern aesthetic.</p>
            </div>
            <div class="footer-links">
                <h3>Customer Care</h3>
                <a href="#">Contact Us</a>
                <a href="#">Shipping & Returns</a>
                <a href="#">Size Guide</a>
            </div>
            <div class="footer-social">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <i class="fab fa-instagram"></i>
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-pinterest"></i>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Luxe Fashion. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
